<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tareas</title>
    <link rel="stylesheet" href="/assets/app.css?v=7">
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <a href="/" class="app-brand" aria-label="Ir a la lista de tareas">
          <span>todo<span class="brand-dot" aria-hidden="true">.</span></span>
        </a>
        <nav aria-label="Principal">
          <a href="/" class="nav-link"<%= if (current_path != "/report") { %> aria-current="page"<% } %>>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="16" rx="3" />
              <path d="m8 12 3 3 5-6" />
            </svg>
            Tareas
          </a>
          <a href="/report" class="nav-link"<%= if (current_path == "/report") { %> aria-current="page"<% } %>>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 20V10M12 20V4M19 20v-7" />
            </svg>
            Informe
          </a>
        </nav>
      </aside>
      <main class="container">
        <%= partial("flash.plush.html") %>
        <%= yield %>
      </main>
    </div>
    <script src="/assets/app.js?v=6" defer></script>
  </body>
</html>
